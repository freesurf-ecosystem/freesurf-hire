name: Deploy web (Cloudflare Workers)

on:
  push:
    branches: [main, master]
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      # NOTE: sitemaps are deliberately NOT generated here yet.
      #
      # `npm run sitemaps:generate` materialises local-services x cities =
      # ~6.98M URLs across 523 files (1.2 GB). Every one of those pages is
      # indexable and, with no contractors signed up, empty. Submitting millions
      # of thin pages is an SEO risk, and a 1.2 GB asset bundle would slow every
      # deploy. Re-enable once the generator is driven by real inventory (only
      # emit service x location pairs that actually have contractors).

      - name: Build & deploy (OpenNext → Cloudflare)
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Public Supabase values, mapped from org-level variables.
          #
          # The *environment* names MUST be NEXT_PUBLIC_* — Next.js only inlines
          # that prefix into the browser bundle. The *GitHub variable* names are
          # free-form, so they use the ecosystem-wide naming (SUPABASE_URL /
          # SUPABASE_PUBLIC_KEY, matching SUPABASE_SECRET_KEY) rather than the
          # Next-specific prefix.
          #
          # Set these once at the org level (Settings -> Secrets and variables ->
          # Actions -> Variables). They are public by design; the secret key is a
          # Cloudflare Worker secret and is never referenced during the build.
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLIC_KEY: ${{ vars.SUPABASE_PUBLIC_KEY }}
