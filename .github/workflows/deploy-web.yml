name: Deploy web (Cloudflare Workers)

on:
  push:
    branches: [main, master]
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      # Diagnostics: shows which variable names are actually populated, without
      # printing values. If these are all false, the org variables either don't
      # exist or haven't been granted to this repository.
      - name: Verify build config
        run: |
          echo "vars.SUPABASE_URL               present: ${{ vars.SUPABASE_URL != '' }}"
          echo "vars.SUPABASE_PUBLIC_KEY        present: ${{ vars.SUPABASE_PUBLIC_KEY != '' }}"
          echo "vars.NEXT_PUBLIC_SUPABASE_URL   present: ${{ vars.NEXT_PUBLIC_SUPABASE_URL != '' }}"
          echo "vars.NEXT_PUBLIC_SUPABASE_PUBLIC_KEY present: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLIC_KEY != '' }}"
          echo "vars.NEXT_PUBLIC_SUPABASE_ANON_KEY   present: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY != '' }}"
          echo "resolved URL empty: ${{ (vars.SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL) == '' }}"
          echo "resolved KEY empty: ${{ (vars.SUPABASE_PUBLIC_KEY || vars.NEXT_PUBLIC_SUPABASE_PUBLIC_KEY || vars.NEXT_PUBLIC_SUPABASE_ANON_KEY) == '' }}"

      # Generates public/sitemap.xml. With local pages quarantined
      # (src/config/seo.json) this is one ~160 KB file covering the static pages,
      # legal pages, and the 925 remote service pages. It only materialises the
      # ~7M local city pages / 1.2 GB when sitemapIncludeLocalPages is turned on,
      # so this stays cheap until there is inventory behind those pages.
      - name: Generate sitemaps
        run: npm run sitemaps:generate

      - name: Build & deploy (OpenNext → Cloudflare)
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Public Supabase values, mapped from org-level variables.
          #
          # The *environment* names MUST be NEXT_PUBLIC_* — Next.js only inlines
          # that prefix into the browser bundle. The *GitHub variable* names are
          # free-form, so accept either convention.
          #
          # They are public by design; the secret key is a Cloudflare Worker
          # secret and is never referenced during the build.
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLIC_KEY: ${{ vars.SUPABASE_PUBLIC_KEY || vars.NEXT_PUBLIC_SUPABASE_PUBLIC_KEY || vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
